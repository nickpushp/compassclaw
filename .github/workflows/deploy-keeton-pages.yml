name: Deploy Keeton Demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'clients/keeton-electric/**'
      - 'templates/service-business/**'
      - '.github/workflows/deploy-keeton-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/keeton-electric/package-lock.json

      - name: Install dependencies
        working-directory: clients/keeton-electric
        run: npm ci

      - name: Restore Vite build entry
        run: cp clients/keeton-electric/app.html clients/keeton-electric/index.html

      - name: Build Keeton demo
        working-directory: clients/keeton-electric
        run: npm run build

      - name: Commit static fallback build
        run: |
          mkdir -p clients/keeton-electric/live
          cp clients/keeton-electric/dist/index.html clients/keeton-electric/live/index.html
          git add clients/keeton-electric/live/index.html
          if git diff --cached --quiet; then
            echo "Static build already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish Keeton static demo [skip ci]"
            git push
          fi

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/clients/keeton-electric
          cp -R clients/keeton-electric/dist/. _site/clients/keeton-electric/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
