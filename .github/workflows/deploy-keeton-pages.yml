name: Deploy Keeton Demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'clients/keeton-electric/**'
      - 'templates/service-business/**'
      - '.github/workflows/deploy-keeton-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/keeton-electric/package-lock.json

      - name: Install dependencies
        working-directory: clients/keeton-electric
        run: npm ci

      - name: Build Keeton demo
        working-directory: clients/keeton-electric
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/clients/keeton-electric
          cp -R clients/keeton-electric/dist/. _site/clients/keeton-electric/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
