name: Deploy to Namecheap

# Runs on every push to main, and lets you trigger a deploy manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once.
concurrency:
  group: namecheap-deploy
  cancel-in-progress: true

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # --- These come from GitHub repo secrets (see README) ---
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Secure FTP over TLS. If your host rejects it, change to: protocol: ftp
          protocol: ftps
          port: 21
          # Local files to upload. The FTP account should point at your site's
          # document root (public_html), so we upload to "./" on the server.
          local-dir: ./
          server-dir: ./
          # Don't ship repo/tooling files to the live site.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.claude/**
            **/node_modules/**
            **/scripts/**
            README.md
            DEPLOYMENT.md
            .gitignore

      - name: Ping IndexNow (instant indexing for Bing & AI engines)
        run: |
          python3 - <<'PY'
          import re, json, urllib.request
          urls = re.findall(r"<loc>([^<]+)</loc>", open("sitemap.xml", encoding="utf-8").read())
          payload = {
              "host": "compassclaw.com",
              "key": "5195e1f47ab57102901d47401abebec2",
              "keyLocation": "https://compassclaw.com/5195e1f47ab57102901d47401abebec2.txt",
              "urlList": urls,
          }
          req = urllib.request.Request("https://api.indexnow.org/indexnow",
              data=json.dumps(payload).encode(), headers={"Content-Type": "application/json"})
          try:
              print("IndexNow:", urllib.request.urlopen(req, timeout=30).status, "for", len(urls), "urls")
          except Exception as e:
              print("IndexNow ping skipped:", e)
          PY
