name: Deploy Keetons Electric Demo

on:
  push:
    branches:
      - demo/keeton-electric
    paths:
      - 'demo-electric/**'
      - '.github/workflows/deploy-keeton-electric.yml'
  workflow_dispatch:

concurrency:
  group: keetons-electric-deploy
  cancel-in-progress: true

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Keetons Electric demo via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./demo-electric/
          server-dir: ./
