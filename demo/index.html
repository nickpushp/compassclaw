<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compass Claw</title>
<meta name="description" content="Compass Claw — the system that catches every lead and compounds it."><meta name="robots" content="noindex">
<link rel="icon" href="assets/logo.jpg">
<link rel="stylesheet" href="funnel.css">
<!-- Stripe's dahlia build, straight from Stripe: it carries initCheckoutFormSdk
     and must never be bundled or self-hosted (PCI). Inert until funnel-content.js
     configures checkout.mode = "embed" with a key and an endpoint. -->
<script src="https://js.stripe.com/dahlia/stripe.js"></script>
</head>
<body>

<div class="app" id="app">

  <!-- ======================================================== top bar -->
  <header class="topbar">
    <div class="brand">
      <img id="js-logo" class="brand-logo" alt="Compass Claw">
      <span class="brand-name" id="js-brand">Compass Claw</span>
    </div>

    <div class="stepline" aria-hidden="true">
      <span class="stepline-track"><span class="stepline-fill" id="js-progress"></span></span>
    </div>
  </header>

  <nav class="rail" id="js-rail" aria-label="Funnel progress"></nav>

  <!-- ========================================================== stage -->
  <main class="stage" id="stage" tabindex="-1">
    <div class="stage-inner">

      <!-- ------------------------------------------------------ 1 Â· open -->
      <section class="screen" id="screen-open" data-step="open">
        <div class="open-hero">
          <img class="open-logo" src="assets/logo.jpg" alt="Compass Claw">
          <p class="lede big" data-bind="line"></p>
        </div>
      </section>

      <!-- -------------------------------------------------- 2 Â· leak -->
      <section class="screen" id="screen-leak" data-step="leak">
        <header class="screen-head">
          <h2 class="lede" data-bind="line"></h2>
        </header>
        <div class="split">
          <div class="panel stack">
            <div id="js-leak-fields"></div>
            <div class="bench" id="js-leak-bench"></div>
          </div>
          <aside class="panel result">
            <p class="result-label" id="js-leak-label"></p>
            <p class="result-num" id="js-leak-num">$0</p>
            <p class="result-derived" id="js-leak-derived"></p>
            <p class="qualifier" id="js-leak-qualifier"></p>
          </aside>
        </div>
      </section>

      <!-- ------------------------------------------------- 3 Â· 4 goals -->
      <section class="screen wide" id="screen-goals" data-step="goals">
        <header class="screen-head">
          <h2 class="lede" data-bind="line"></h2>
        </header>
        <figure class="art" data-zoom="assets/goals.jpg" role="button" tabindex="0" aria-label="Enlarge the four goals graphic">
          <img src="assets/goals.jpg" alt="The four goals a Compass Claw build is measured against">
          <div class="hotspots" data-hotspots="goals"></div>
        </figure>
        <p class="hint" data-bind="zoomHint"></p>
      </section>

      <!-- ------------------------------------------------ 4 Â· system -->
      <section class="screen wide" id="screen-system" data-step="system">
        <header class="screen-head">
          <h2 class="lede" data-bind="line"></h2>
        </header>
        <figure class="art" data-zoom="assets/system.jpg" role="button" tabindex="0" aria-label="Enlarge the system diagram">
          <img src="assets/system.jpg" alt="The Compass Claw system, from first call to compounding loop">
          <div class="hotspots" data-hotspots="system"></div>
        </figure>
        <p class="hint" data-bind="zoomHint"></p>
      </section>

      <!-- -------------------------------------------------- 5 Â· demo -->
      <section class="screen wide" id="screen-demo" data-step="demo">
        <header class="screen-head">
          <h2 class="lede" data-bind="line"></h2>
        </header>

        <div class="demo-wrap">
          <div class="demo-bar">
            <span class="demo-dots" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="demo-url" id="js-demo-url"></span>
            <div class="seg" role="group" aria-label="Demo viewport size">
              <button type="button" class="seg-btn on" data-device="desktop">Desktop</button>
              <button type="button" class="seg-btn" data-device="mobile">Mobile</button>
            </div>
            <a class="btn ghost sm" id="js-demo-open" target="_blank" rel="noopener">Open the demo full size</a>
          </div>
          <div class="device" data-device="desktop" id="js-device">
            <iframe id="js-demo-frame" title="Live Compass Claw product demo" src="about:blank"></iframe>
          </div>
        </div>

        <ul class="checklist" id="js-demo-check"></ul>
        <p class="qualifier" id="js-demo-note"></p>
      </section>

      <!-- -------------------------------------------------- 6 Â· loop -->
      <section class="screen wide" id="screen-loop" data-step="loop">
        <header class="screen-head">
          <h2 class="lede" data-bind="line"></h2>
        </header>
        <div class="loop-grid">
          <figure class="art" data-zoom="assets/loop.jpg" role="button" tabindex="0" aria-label="Enlarge the compounding loop diagram">
            <img src="assets/loop.jpg" alt="The Compass Claw compounding loop">
            <div class="hotspots" data-hotspots="loop"></div>
          </figure>
          <div class="loop-calc">
            <div class="panel" id="js-loop-fields"></div>
            <div class="panel chart-panel">
              <div class="chart-head">
                <div><span class="chart-k" id="js-loop-start-label">Month 1</span><strong id="js-loop-start">$0</strong></div>
                <div class="chart-arrow" aria-hidden="true">&#8594;</div>
                <div><span class="chart-k" id="js-loop-end-label">Month 12</span><strong id="js-loop-end">$0</strong></div>
              </div>
              <canvas id="js-loop-chart" width="640" height="260" role="img"
                      aria-label="Twelve month curve built from the numbers entered"></canvas>
              <p class="delta" id="js-loop-delta"></p>
              <p class="qualifier" id="js-loop-qualifier"></p>
            </div>
          </div>
        </div>
      </section>

      <!-- ------------------------------------------------- 7 Â· offer -->
      <section class="screen wide" id="screen-offer" data-step="offer">
        <header class="screen-head">
          <h2 class="lede" data-bind="line"></h2>
        </header>
        <div class="offer-grid">
          <figure class="art tall" data-zoom="assets/price-card.jpg" role="button" tabindex="0" aria-label="Enlarge the price card">
            <img src="assets/price-card.jpg" alt="The Compass Claw offer and price card">
          </figure>
          <div class="panel">
            <h3 class="panel-title">What gets installed</h3>
            <ul class="included" id="js-included"></ul>
            <p class="qualifier" data-bind="secureNote"></p>
          </div>
        </div>
      </section>

      <!-- ---------------------------------------------- 8 Â· checkout -->
      <section class="screen" id="screen-checkout" data-step="checkout">
        <header class="screen-head">
          <h2 class="lede" data-bind="line"></h2>
        </header>
        <div class="split">
          <div class="panel">
            <h3 class="panel-title" data-bind="summaryTitle">This call, in numbers</h3>
            <dl class="summary" id="js-summary"></dl>
            <p class="qualifier" data-bind="secureNote"></p>
          </div>
          <div class="panel" id="js-checkout-status"></div>
        </div>

        <!-- Embedded checkout only (checkout.mode = "embed"): Stripe's own card
             form, mounted here by funnel-stripe.js. Empty in popup mode. -->
        <div class="embed-slot" id="checkout-form" hidden></div>
      </section>

      <!-- -------------------------------------------- 9 Â· onboarding -->
      <section class="screen wide" id="screen-onboarding" data-step="onboarding">
        <header class="screen-head">
          <h2 class="lede" data-bind="line"></h2>
        </header>

        <div class="panel lock" id="js-lock"></div>

        <div class="form-wrap" id="js-form-wrap" hidden>
          <p class="form-status" id="js-tally-status"></p>
          <iframe id="js-tally-frame" title="Compass Claw onboarding intake form" src="about:blank"></iframe>
          <div class="fallback" id="js-tally-fallback" hidden>
            <p id="js-tally-fallback-text"></p>
            <a class="btn primary" id="js-tally-open" target="_blank" rel="noopener">Open the intake form</a>
          </div>
        </div>

        <div class="done" id="js-done" hidden>
          <h3 class="panel-title" id="js-done-title"></h3>
          <ol class="timeline" id="js-timeline"></ol>
          <div class="recap">
            <p class="recap-line" id="js-recap-line"></p>
            <pre class="recap-box" id="js-recap"></pre>
            <button class="btn ghost sm" type="button" id="js-recap-copy">Copy recap</button>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- ============================================================ nav -->
  <footer class="guidebar">
    <div class="nav">
      <button class="btn ghost" type="button" id="js-back">Back</button>
      <button class="btn primary" type="button" id="js-next">Continue</button>
    </div>
  </footer>
</div>

<!-- ========================================================== overlays -->
<div class="lightbox" id="js-lightbox" hidden role="dialog" aria-modal="true" aria-label="Enlarged graphic">
  <button class="lightbox-close" type="button" id="js-lightbox-close">Close</button>
  <img id="js-lightbox-img" alt="">
</div>

<div class="modal" id="js-modal" hidden role="dialog" aria-modal="true" aria-labelledby="js-modal-text">
  <div class="modal-box">
    <p id="js-modal-text"></p>
    <div class="row end">
      <button class="btn ghost" type="button" id="js-modal-cancel">Cancel</button>
      <button class="btn primary" type="button" id="js-modal-ok">Restart</button>
    </div>
  </div>
</div>

<div class="toast" id="js-toast" hidden></div>

<script src="funnel-content.js"></script>
<!-- Stripe-specific glue. Silent unless checkout.mode === "embed" (see README). -->
<script src="funnel-stripe.js"></script>
<script src="funnel.js"></script>
</body>
</html>
